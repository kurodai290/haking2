<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resume</title><link rel="stylesheet" href="style.css"></head><body><main class="panel"><h1>RESUME</h1><p id="msg">サーバーの進行状況を確認しています…</p><script>fetch("/api/progress",{credentials:"same-origin"}).then(r=>r.json()).then(p=>location.replace(p.unlocked>=16?"complete.html":`stage${String(p.unlocked).padStart(2,"0")}.html`)).catch(()=>document.getElementById("msg").textContent="サーバーに接続できません。再読み込みしてください。");</script></main></body></html>
